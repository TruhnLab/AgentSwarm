[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentswarm"
version = "0.1.0"
description = "A swarm of identical tool-using LLM agents that cooperate through a shared forum and a shared git repository with pull requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agentswarm = "agentswarm.cli:main"

[tool.setuptools]
packages = ["agentswarm"]
